<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        .code {
            font-size: 120px;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 10px rgba(102, 126, 234, 0.2);
        }
        
        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .message {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .url-box {
            background: #f5f5f5;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: monospace;
            word-break: break-all;
            color: #764ba2;
            font-size: 14px;
        }
        
        .home-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            border: none;
            cursor: pointer;
        }
        
        .home-btn:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }
        
        .suggestions {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
            font-size: 14px;
            color: #888;
        }
        
        .suggestions ul {
            margin-top: 10px;
            padding-left: 20px;
        }
        
        .suggestions li {
            margin: 5px 0;
        }
        
        .footer {
            margin-top: 20px;
            color: #bbb;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="title">😕 页面未找到</div>
        <div class="message">
            抱歉，您访问的页面不存在或已被移除。
        </div>
        
        <div class="url-box" id="requestedUrl">
            <!-- 这里会显示请求的URL -->
        </div>
        
        <a href="/" class="home-btn">🏠 返回首页</a>
        
        <div class="suggestions">
            💡 您可能想访问：
            <ul>
                <li>• <a href="/" style="color: #667eea;">首页</a></li>
                <li>• <a href="/test.html" style="color: #667eea;">测试页面</a></li>
                <li>• <a href="/about.html" style="color: #667eea;">关于</a></li>
            </ul>
        </div>
        
        <div class="footer">
            C++ HTTP Server | 404 Not Found
        </div>
    </div>
    
    <script>
        // 显示请求的 URL
        const url = window.location.href;
        document.getElementById('requestedUrl').textContent = url;
        
        // 可选：添加一点动画效果
        console.log('404 page loaded for: ' + url);
    </script>
</body>
</html>

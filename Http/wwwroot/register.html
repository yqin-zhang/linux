<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 我的HTTP服务器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .logo p {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group small {
            display: block;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .error-msg {
            background: #fee;
            color: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-msg {
            background: #efe;
            color: #27ae60;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .password-strength {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin-top: 8px;
            transition: width 0.3s;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #bbb;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📝 创建账户</h1>
            <p>加入我们，开始你的旅程</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
                <small>3-20个字符，支持字母、数字、下划线</small>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="请输入邮箱地址" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirmPwd" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn">注 册</button>
        </form>
        
        <div class="links">
            <a href="/login.html">已有账号？立即登录</a>
        </div>
        
        <div class="footer">
            C++ HTTP Server | 简单注册示例
        </div>
    </div>
    
    <script>
        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        
        // 密码强度检测
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            return Math.min(strength, 4);
        }
        
        function updateStrengthBar() {
            const password = passwordInput.value;
            const strength = checkPasswordStrength(password);
            const widths = ['0%', '25%', '50%', '75%', '100%'];
            const colors = ['#ddd', '#e74c3c', '#f39c12', '#f1c40f', '#27ae60'];
            
            strengthBar.style.width = widths[strength];
            strengthBar.style.background = colors[strength];
        }
        
        passwordInput.addEventListener('input', updateStrengthBar);
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            
            // 验证
            if (username.length < 3 || username.length > 20) {
                errorMsg.textContent = '用户名长度必须在 3-20 个字符之间';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                errorMsg.textContent = '用户名只能包含字母、数字和下划线';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                errorMsg.textContent = '请输入有效的邮箱地址';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = '密码长度至少为 6 位';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password !== confirmPwd) {
                errorMsg.textContent = '两次输入的密码不一致';
                errorMsg.style.display = 'block';
                return;
            }
            
            // 模拟注册请求（实际应发送到后端）
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    successMsg.textContent = result.message || '注册成功，正在跳转到登录页...';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = result.message || '注册失败，请稍后重试';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                // 模拟演示：前端演示模式
                successMsg.textContent = '注册成功（演示模式），即将跳转登录页';
                successMsg.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
